<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FYP Malam yang selalu bahagia</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f0f4f9;
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }
        /* Latar Belakang Ambient Putih-Biru Halus */
        .ambient-sky {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(219, 234, 254, 0.9) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(191, 219, 254, 0.6) 0px, transparent 50%),
                radial-gradient(#94a3b8 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 24px 24px;
        }
        /* Efek Shimmer Kilau Tombol */
        .btn-shimmer {
            position: relative;
            overflow: hidden;
        }
        .btn-shimmer::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            transform: rotate(30deg);
            animation: shine 3.2s infinite ease-in-out;
        }
        @keyframes shine {
            0% { transform: translateX(-150%) rotate(30deg); }
            50%, 100% { transform: translateX(150%) rotate(30deg); }
        }
        @keyframes subtle-float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        .float-icon {
            animation: subtle-float 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="ambient-sky min-h-screen flex items-center justify-center p-4 sm:p-6">

    <!-- Card Wrapper Utama -->
    <div class="w-full max-w-md bg-white/95 border border-blue-100 backdrop-blur-xl rounded-[2.2rem] p-7 sm:p-9 shadow-[0_20px_60px_-15px_rgba(37,99,235,0.12)] flex flex-col items-center text-center relative overflow-hidden transition-all">
        
        <!-- Aksen Garis Gradien Atas -->
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-blue-500 via-indigo-500 to-cyan-400"></div>

        <!-- Badge Status Aktif -->
        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-blue-50/90 border border-blue-200/60 text-blue-700 text-xs font-semibold mb-6 mt-1 shadow-sm">
            <span class="flex h-2 w-2 relative">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-500 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-blue-600"></span>
            </span>
            <span class="tracking-wide">Server Siap Putar</span>
            <span class="text-blue-300">•</span>
            <span class="font-bold uppercase tracking-wider text-[11px] text-blue-800">Ultra HD</span>
        </div>

        <!-- Icon Play Modern Mengambang -->
        <div class="float-icon relative mb-6">
            <div class="w-20 h-20 sm:w-24 sm:h-24 bg-gradient-to-tr from-blue-600 to-indigo-500 text-white rounded-3xl flex items-center justify-center text-3xl sm:text-4xl shadow-xl shadow-blue-500/30 border-4 border-white">
                <i class="fas fa-play ml-1"></i>
            </div>
            <!-- Badge 1080p -->
            <span class="absolute -bottom-2 -right-2 bg-slate-900 text-white text-[10px] font-black px-2.5 py-0.5 rounded-md shadow-md border border-slate-700">
                1080P
            </span>
        </div>

        <!-- Judul Utama -->
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight leading-snug mb-3">
            Tonton Tayangan Lengkap
        </h1>

        <!-- Deskripsi Konten -->
        <p class="text-slate-600 text-sm sm:text-base leading-relaxed mb-8 px-2 font-normal">
            Klik tombol di bawah ini untuk mengakses pemutar streaming langsung berkecepatan tinggi tanpa hambatan.
        </p>

        <!-- Tombol Aksi Utama (Sangat Menarik & Thumb-Friendly) -->
        <button id="startBtn" class="btn-shimmer w-full bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-700 hover:from-blue-500 hover:to-indigo-500 active:scale-[0.98] text-white font-bold py-4 sm:py-5 px-6 rounded-2xl text-base sm:text-lg shadow-xl shadow-blue-600/30 transition-all flex items-center justify-center gap-3 cursor-pointer mb-7 border border-blue-400/20">
            <i class="fas fa-circle-play text-xl"></i>
            <span>Buka Pemutar Sekarang</span>
            <i class="fas fa-arrow-right text-sm"></i>
        </button>

        <!-- Spesifikasi 3 Kolom Bawah -->
        <div class="pt-5 border-t border-slate-100 w-full grid grid-cols-3 gap-2 text-slate-500 text-xs font-semibold">
            <div class="flex flex-col items-center gap-1.5 p-1 rounded-xl">
                <i class="fas fa-tv text-blue-600 text-base"></i>
                <span class="text-slate-700">Kualitas HD</span>
            </div>
            <div class="flex flex-col items-center gap-1.5 p-1 rounded-xl">
                <i class="fas fa-bolt text-amber-500 text-base"></i>
                <span class="text-slate-700">Fast Buffering</span>
            </div>
            <div class="flex flex-col items-center gap-1.5 p-1 rounded-xl">
                <i class="fas fa-shield-check text-emerald-500 text-base"></i>
                <span class="text-slate-700">Aman & Lancar</span>
            </div>
        </div>

    </div>

    <!-- Script Redirect -->
    <script>
        document.getElementById('startBtn').addEventListener('click', function() {
            setTimeout(function() {
                window.open('watch.html', '_blank');
                window.location.href = 'https://mediaax.blogspot.com/';
            }, 100);
        });
    </script>

    <!-- Tracker Histats -->
    <script type='text/javascript'>
        var _Hasync=_Hasync||[];
        _Hasync.push(['Histats.start', '1,4912344,4,0,0,0,00010000']);
        _Hasync.push(['Histats.fasi', '1']);
        _Hasync.push(['Histats.track_hits', '']);
        (function(){
            var hs = document.createElement('script'); hs.async = true;
            hs.src = '//s10.histats.com/js15_as.js';
            (document.head||document.body).appendChild(hs);
        })();
    </script>
</body>
</html>
