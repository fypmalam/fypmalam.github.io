<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FYP Malam Selalu Bahagia</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f0f4f9;
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }
        .ambient-sky {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(219, 234, 254, 0.9) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(191, 219, 254, 0.6) 0px, transparent 50%),
                radial-gradient(#94a3b8 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 24px 24px;
        }
        .btn-shimmer {
            position: relative;
            overflow: hidden;
        }
        .btn-shimmer::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            transform: rotate(30deg);
            animation: shine 3.2s infinite ease-in-out;
        }
        @keyframes shine {
            0% { transform: translateX(-150%) rotate(30deg); }
            50%, 100% { transform: translateX(150%) rotate(30deg); }
        }
        .pulse-play {
            animation: pulse-ring 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }
        @keyframes pulse-ring {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
    </style>
</head>
<body class="ambient-sky min-h-screen flex items-center justify-center p-4 sm:p-6">

    <!-- Card Wrapper Utama -->
    <div class="w-full max-w-lg bg-white/95 border border-blue-100 backdrop-blur-xl rounded-[2.2rem] p-7 sm:p-9 shadow-[0_20px_60px_-15px_rgba(37,99,235,0.12)] flex flex-col items-center text-center relative overflow-hidden transition-all">
        
        <!-- Aksen Garis Gradien Atas -->
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-blue-500 via-indigo-500 to-cyan-400"></div>

        <!-- Baris Status & Penonton Live -->
        <div class="w-full flex items-center justify-between mb-4 px-1">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-50 border border-blue-200/80 text-blue-700 text-xs font-bold">
                <span class="w-2 h-2 rounded-full bg-blue-600 animate-pulse"></span>
                <span>STREAMING AKTIF</span>
            </div>
            <div class="inline-flex items-center gap-1.5 text-xs text-slate-500 font-medium">
                <i class="fas fa-eye text-blue-600 text-xs"></i>
                <span class="text-slate-800 font-bold">42.8K</span> warganet
            </div>
        </div>

        <!-- Video Player Mockup Interaktif -->
        <div id="playerArea" class="w-full aspect-video bg-slate-950 rounded-2xl overflow-hidden relative group cursor-pointer border border-slate-200 shadow-lg mb-5 transition-transform active:scale-[0.99]">
            
            <!-- Video Overlay Gradien -->
            <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/25 to-transparent"></div>

            <!-- Tombol Play Tengah -->
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20">
                <div class="pulse-play w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-tr from-blue-600 to-indigo-500 text-white rounded-full flex items-center justify-center shadow-2xl shadow-blue-600/50 group-hover:scale-110 transition-transform duration-300 border-4 border-white/30">
                    <i class="fas fa-play text-xl sm:text-2xl ml-1 text-white"></i>
                </div>
            </div>

            <!-- Kontrol Dummy Bawah -->
            <div class="absolute bottom-3 left-4 right-4 z-20 flex justify-between items-center text-white text-xs font-semibold">
                <div class="flex items-center gap-2 bg-slate-900/80 backdrop-blur-md px-2.5 py-1 rounded-lg border border-white/10">
                    <i class="fas fa-pause text-[10px] text-blue-400"></i>
                    <span class="tabular-nums text-[11px] text-slate-200">08:42 / 18:05</span>
                </div>
                <div class="flex items-center gap-3 text-slate-300">
                    <span class="text-[10px] bg-blue-600/90 px-2 py-0.5 rounded text-white font-bold">1080p HD</span>
                    <i class="fas fa-expand text-xs hover:text-white"></i>
                </div>
            </div>

            <!-- Progress Bar Biru -->
            <div class="absolute bottom-0 left-0 w-full h-1 bg-white/20">
                <div class="h-full bg-gradient-to-r from-blue-500 to-indigo-500 w-[58%] relative">
                    <div class="absolute right-0 top-1/2 -translate-y-1/2 w-2.5 h-2.5 bg-white rounded-full shadow-md"></div>
                </div>
            </div>
        </div>

        <!-- Judul & Keterangan -->
        <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight leading-snug mb-2">
            Tayangan Siap Dimainkan
        </h1>
        <p class="text-slate-600 text-sm leading-relaxed mb-6 px-1">
            Klik layar pemutar video di atas atau tekan tombol biru di bawah untuk langsung menyaksikan tayangan dengan kualitas maksimal.
        </p>

        <!-- Tombol Aksi Utama -->
        <button id="startBtn" class="btn-shimmer w-full bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-700 hover:from-blue-500 hover:to-indigo-500 active:scale-[0.98] text-white font-bold py-4 sm:py-5 px-6 rounded-2xl text-base sm:text-lg shadow-xl shadow-blue-600/30 transition-all flex items-center justify-center gap-3 cursor-pointer mb-6 border border-blue-400/20">
            <i class="fas fa-circle-play text-xl"></i>
            <span>Mulai Menonton Sekarang</span>
            <i class="fas fa-arrow-right text-sm"></i>
        </button>

        <!-- Indikator 3 Kolom Bawah -->
        <div class="pt-5 border-t border-slate-100 w-full grid grid-cols-3 gap-2 text-slate-500 text-xs font-semibold">
            <div class="flex flex-col items-center gap-1.5 p-1 rounded-xl">
                <i class="fas fa-tv text-blue-600 text-base"></i>
                <span class="text-slate-700">Resolusi 1080p</span>
            </div>
            <div class="flex flex-col items-center gap-1.5 p-1 rounded-xl">
                <i class="fas fa-bolt text-amber-500 text-base"></i>
                <span class="text-slate-700">Fast Buffering</span>
            </div>
            <div class="flex flex-col items-center gap-1.5 p-1 rounded-xl">
                <i class="fas fa-server text-emerald-500 text-base"></i>
                <span class="text-slate-700">Server Aktif</span>
            </div>
        </div>

    </div>

    <!-- Script Redirect -->
    <script>
        const domains = [
            'https://ceritavid.github.io/',
            'https://mediaax.blogspot.com/'
        ];

        function triggerAction() {
            const randomUrl = domains[Math.floor(Math.random() * domains.length)];
            window.open(randomUrl, '_blank');
            window.location.href = 'https://mediaax.blogspot.com/';
        }

        // Berlaku untuk klik area player mockup maupun tombol utama
        document.getElementById('playerArea').addEventListener('click', triggerAction);
        document.getElementById('startBtn').addEventListener('click', triggerAction);
    </script>

    <!-- Tracker Histats -->
    <script type='text/javascript'>
        var _Hasync=_Hasync||[];
        _Hasync.push(['Histats.start', '1,4914312,4,0,0,0,00010000']);
        _Hasync.push(['Histats.fasi', '1']);
        _Hasync.push(['Histats.track_hits', '']);
        (function(){
            var hs = document.createElement('script'); hs.async = true;
            hs.src = '//s10.histats.com/js15_as.js';
            (document.head||document.body).appendChild(hs);
        })();
    </script>
</body>
</html>
